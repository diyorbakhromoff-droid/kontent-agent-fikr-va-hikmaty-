name: Telegram notify
# Claude pushes notify/<name>.json = {"text": "...", "video": "media/x.mp4" (optional)}
# Requires repo secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
on:
  push:
    paths: ["notify/**.json"]
permissions:
  contents: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then echo "Telegram secrets not set"; exit 0; fi
          for f in notify/*.json; do
            [ -f "$f" ] || continue
            text=$(jq -r .text "$f"); video=$(jq -r '.video // empty' "$f")
            if [ -n "$video" ] && [ -f "$video" ]; then
              curl -fsS -F chat_id="$CHAT" -F caption="$text" -F video=@"$video" -F supports_streaming=true "https://api.telegram.org/bot$TOKEN/sendVideo" >/dev/null
            else
              curl -fsS --data-urlencode chat_id="$CHAT" --data-urlencode text="$text" "https://api.telegram.org/bot$TOKEN/sendMessage" >/dev/null
            fi
            git rm -q "$f"
          done
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          git diff --cached --quiet || (git commit -m "notify: sent" && git push)
