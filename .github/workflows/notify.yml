name: Telegram notify
# Claude pushes notify/<name>.json = {"text": "...", "video": "media/x.mp4" (optional), "approve_id": "reel001-script" (optional)}
# With approve_id the message gets "Tasdiqlash / O'zgartirish" buttons.
on:
  push:
    paths: ["notify/**.json"]
permissions:
  contents: write
concurrency: { group: telegram, cancel-in-progress: false }
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send to Telegram
        env: { TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}" }
        run: |
          set -e
          git config user.name "reels-bot"; git config user.email "reels-bot@users.noreply.github.com"
          status(){ mkdir -p config; echo "$(date -u +%FT%TZ) $1" > config/telegram_status.txt; git add -A config; git commit -qm "telegram status: $1" && git push -q; }
          [ -n "$TOKEN" ] || { status "NO_TOKEN"; exit 0; }
          me=$(curl -sS "https://api.telegram.org/bot$TOKEN/getMe" | jq -r '.result.username // "BAD_TOKEN"')
          python3 scripts/tg_poll.py   # make sure chat id is known
          CHAT=$(jq -r '.chat_id // empty' config/telegram.json 2>/dev/null || true)
          [ -n "$CHAT" ] || { status "NO_GROUP bot=$me"; exit 0; }
          for f in notify/*.json; do
            [ -f "$f" ] || continue
            text=$(jq -r .text "$f"); video=$(jq -r '.video // empty' "$f"); aid=$(jq -r '.approve_id // empty' "$f")
            kb=""
            if [ -n "$aid" ]; then
              kb=$(jq -cn --arg a "$aid" '{inline_keyboard:[[{text:"✅ Tasdiqlash",callback_data:("ok:"+$a)},{text:"✏️ O‘zgartirish",callback_data:("edit:"+$a)}]]}')
              mkdir -p approvals; [ -f "approvals/$aid.json" ] || echo "{\"id\":\"$aid\",\"status\":\"pending\",\"comments\":[]}" > "approvals/$aid.json"
            fi
            if [ -n "$video" ] && [ -f "$video" ]; then
              resp=$(curl -fsS -F chat_id="$CHAT" -F caption="$text" -F video=@"$video" -F supports_streaming=true ${kb:+-F reply_markup="$kb"} "https://api.telegram.org/bot$TOKEN/sendVideo")
            else
              resp=$(curl -fsS --data-urlencode chat_id="$CHAT" --data-urlencode text="$text" ${kb:+--data-urlencode reply_markup="$kb"} "https://api.telegram.org/bot$TOKEN/sendMessage")
            fi
            if [ -n "$aid" ]; then mid=$(echo "$resp" | jq .result.message_id); jq --argjson m "$mid" '.message_id=$m | .status="pending"' "approvals/$aid.json" > t && mv t "approvals/$aid.json"; fi
            git rm -q "$f"
          done
          echo "$(date -u +%FT%TZ) OK bot=$me chat=$CHAT" > config/telegram_status.txt
          git add -A . ; git diff --cached --quiet || (git commit -m "notify: sent" && git pull --rebase -q && git push)
